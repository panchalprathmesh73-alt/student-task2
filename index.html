<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student task</title>
</head>
<body>
    <h1 class="bg-primary mt-4 py-4 text-white text-center rounded">Student Form</h1>
    <div class="container mt-4">
        <div class="row col-md-4">
            <form id="todoform">
                <div class="form-group">
                    <label for="fname">Fname*</label>
                    <input type="text" class="form-control" id="fname">
                </div>
                <div class="form-group">
                    <label for="lname">Lname*</label>
                    <input type="text" class="form-control" id="lname">
                </div>
                <div class="form-group">
                    <label for="contact">Contact*</label>
                    <input type="number" class="form-control" id="contact">
                </div>
                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="form-group">
                    <label for="bdate">Birthd*</label>
                    <input type="date" class="form-control" id="bdate">
                </div>
                <button type="submit" id="submitbtn" class="btn btn-sm btn-warning btn-block">+Add Todo Student</button>
            </form>
        <div class="col-md-8 mt-4">
            <table class="table table-info">
                <thead>
                    <tr>
                        <th>SrNo</th>
                        <th> FName</th>
                        <th>LName</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Bdate</th>
                        <th>Edit</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody id="Student">

                </tbody>
            </table>
        </div>  
    </div>
    </div>
    <script src="./assets/js/app.js"></script>

</body>
</html>
